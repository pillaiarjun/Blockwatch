<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Watch</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111110;
    --surface: #1a1a19;
    --border: #33332f;
    --text: #ffffff;
    --text-2: #c3c2b7;
    --accent: #3987e5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px;
  }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 2.2rem; letter-spacing: -0.02em; }
  h1 .dot { color: var(--accent); }
  #camera-name { color: var(--text-2); font-size: 1.2rem; }
  #camera-select {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 1rem; max-width: 340px;
  }
  #last-updated { margin-left: auto; color: var(--text-2); font-size: 1rem; }

  .grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .panel h2 {
    font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-2); margin-bottom: 12px; font-weight: 600;
  }

  #frame-wrap { position: relative; min-height: 240px; display: flex; align-items: center; justify-content: center; }
  #frame { width: 100%; border-radius: 8px; display: none; }
  .waiting { color: var(--text-2); font-size: 1.3rem; text-align: center; padding: 40px 0; }

  #stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; text-align: center;
  }
  .stat-card .num { font-size: 2.8rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-card .label { color: var(--text-2); font-size: 1rem; text-transform: capitalize; margin-top: 4px; }

  #narration-box {
    border-left: 4px solid var(--accent);
    background: var(--bg);
    border-radius: 0 10px 10px 0;
    padding: 16px 18px;
    font-size: 1.35rem;
    line-height: 1.5;
    min-height: 84px;
  }
  #narration-box.empty { color: var(--text-2); font-style: italic; }

  #trend-svg { width: 100%; height: 120px; display: block; }
  .right-col { display: flex; flex-direction: column; gap: 20px; }
</style>
</head>
<body>
  <header>
    <h1>Block Watch<span class="dot">.</span></h1>
    <select id="camera-select" aria-label="Choose a camera">
      <option value="">loading cameras…</option>
    </select>
    <span id="camera-name">locating camera…</span>
    <span id="last-updated"></span>
  </header>

  <div class="grid">
    <div class="panel">
      <h2>Live camera</h2>
      <div id="frame-wrap">
        <img id="frame" alt="Latest traffic camera frame">
        <div class="waiting" id="frame-waiting">waiting for first frame…</div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel">
        <h2>On the block right now</h2>
        <div id="stat-cards"><div class="waiting">waiting for detections…</div></div>
      </div>

      <div class="panel">
        <h2>Block Watch says</h2>
        <div id="narration-box" class="empty">Gemini is watching — first narration in about a minute…</div>
      </div>

      <div class="panel">
        <h2>Total detections per minute</h2>
        <svg id="trend-svg" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var frameImg = document.getElementById("frame");
  var frameWaiting = document.getElementById("frame-waiting");
  var cameraSelect = document.getElementById("camera-select");
  var currentCameraId = null;
  var pendingCameraId = null;

  var NARRATION_PLACEHOLDER = "Gemini is watching — first narration in about a minute…";

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function loadCameras() {
    fetch("/api/cameras")
      .then(function (r) { return r.json(); })
      .then(function (cams) {
        if (!cams || !cams.length) {
          // Transient list failure: keep the picker and retry — being able to
          // hook onto any camera from the UI is the whole point.
          cameraSelect.innerHTML = '<option value="">cameras unavailable — retrying…</option>';
          setTimeout(loadCameras, 5000);
          return;
        }
        var groups = {};
        cams.forEach(function (c) {
          var area = c.area || "Other";
          if (!groups[area]) groups[area] = [];
          groups[area].push(c);
        });
        var html = '<option value="">— choose a camera —</option>';
        Object.keys(groups).sort().forEach(function (area) {
          html += '<optgroup label="' + escapeHtml(area) + '">';
          groups[area].forEach(function (c) {
            html += '<option value="' + escapeHtml(c.id) + '">' +
                    escapeHtml(c.name || c.id) + '</option>';
          });
          html += '</optgroup>';
        });
        cameraSelect.innerHTML = html;
        if (currentCameraId) cameraSelect.value = currentCameraId;
      })
      .catch(function () {
        cameraSelect.innerHTML = '<option value="">cameras unavailable — retrying…</option>';
        setTimeout(loadCameras, 5000);
      });
  }

  cameraSelect.addEventListener("change", function () {
    var id = cameraSelect.value;
    if (!id || id === currentCameraId) return;
    fetch("/api/camera", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id })
    })
      .then(function (r) {
        if (!r.ok) throw new Error("switch failed");
        pendingCameraId = id;
        frameEpoch += 1; // invalidate in-flight frame probes from the old camera
        document.getElementById("camera-name").textContent = "switching…";
        frameImg.style.display = "none";
        frameWaiting.style.display = "block";
        renderNarration("");
        renderStats({});
      })
      .catch(function () {
        document.getElementById("camera-name").textContent =
          "switch failed — try another camera";
        cameraSelect.value = currentCameraId || "";
      });
  });

  var frameEpoch = 0;
  function refreshFrame() {
    var probe = new Image();
    var epoch = frameEpoch;
    probe.onload = function () {
      if (epoch !== frameEpoch) return; // camera switched while this loaded
      frameImg.src = probe.src;
      frameImg.style.display = "block";
      frameWaiting.style.display = "none";
    };
    // onerror (incl. the 204 no-frame-yet case): keep whatever is showing.
    probe.src = "/frame.jpg?t=" + Date.now();
  }

  function renderStats(counts) {
    var el = document.getElementById("stat-cards");
    var keys = Object.keys(counts || {}).sort(function (a, b) {
      return counts[b] - counts[a];
    });
    if (!keys.length) {
      el.innerHTML = '<div class="waiting">waiting for detections…</div>';
      return;
    }
    el.innerHTML = keys.map(function (k) {
      return '<div class="stat-card"><div class="num">' + counts[k] +
             '</div><div class="label">' + k + '</div></div>';
    }).join("");
  }

  function renderNarration(text) {
    var box = document.getElementById("narration-box");
    if (text) {
      box.textContent = "“" + text + "”";
      box.classList.remove("empty");
    } else {
      box.textContent = NARRATION_PLACEHOLDER;
      box.classList.add("empty");
    }
  }

  function totalOf(counts) {
    var t = 0;
    for (var k in counts) t += counts[k];
    return t;
  }

  // Bucket history into per-minute totals and draw baseline-anchored bars.
  function renderTrend(history) {
    var svg = document.getElementById("trend-svg");
    if (!history || history.length < 2) { svg.innerHTML = ""; return; }

    var buckets = {};
    history.forEach(function (h) {
      // Bucket and label in the viewer's local time (ts is UTC ISO).
      var t = new Date(h.ts);
      var minute = t.getTime() - t.getTime() % 60000;
      if (!buckets[minute]) buckets[minute] = { total: 0, n: 0 };
      buckets[minute].total += totalOf(h.counts);
      buckets[minute].n += 1;
    });
    var minutes = Object.keys(buckets).map(Number).sort(function (a, b) { return a - b; }).slice(-30);
    var vals = minutes.map(function (m) {
      return buckets[m].total / buckets[m].n; // avg total per sample that minute
    });
    var max = Math.max.apply(null, vals) || 1;

    var W = 400, H = 120, pad = 4;
    var bw = (W - pad * 2) / vals.length;
    var parts = vals.map(function (v, i) {
      var h = Math.max(2, (v / max) * (H - 14));
      var x = pad + i * bw;
      var label = new Date(minutes[i]).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) +
                  " — avg " + v.toFixed(1) + " objects";
      return '<rect x="' + (x + 1).toFixed(1) + '" y="' + (H - h).toFixed(1) +
             '" width="' + Math.max(1, bw - 2).toFixed(1) + '" height="' + h.toFixed(1) +
             '" rx="2" fill="var(--accent)"><title>' + label + '</title></rect>';
    });
    svg.innerHTML = parts.join("");
  }

  function poll() {
    fetch("/api/state")
      .then(function (r) { return r.json(); })
      .then(function (s) {
        var cam = s.camera || {};
        if (cam.id) {
          currentCameraId = cam.id;
          if (pendingCameraId && cam.id === pendingCameraId) pendingCameraId = null;
          if (!pendingCameraId && cameraSelect.value !== cam.id &&
              cameraSelect.style.display !== "none") {
            cameraSelect.value = cam.id;
          }
        }
        if ((cam.name || cam.id) && !pendingCameraId) {
          document.getElementById("camera-name").textContent =
            (cam.name || cam.id) +
            (cam.latitude ? " (" + cam.latitude + ", " + cam.longitude + ")" : "");
        }
        var lastUpdated = document.getElementById("last-updated");
        if (s.status) {
          lastUpdated.textContent = "⚠ " + s.status;
        } else if (s.last_updated) {
          lastUpdated.textContent =
            "last updated " + new Date(s.last_updated).toLocaleTimeString();
        } else {
          lastUpdated.textContent = "";
        }
        renderStats(s.counts);
        renderNarration(s.narration);
        renderTrend(s.history);
      })
      .catch(function () { /* keep last good render */ });
  }

  loadCameras();
  poll();
  refreshFrame();
  setInterval(poll, 3000);
  setInterval(refreshFrame, 3000);
})();
</script>
</body>
</html>
